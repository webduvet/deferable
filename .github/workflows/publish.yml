name: Publish to npm
# Runs when a GitHub release is published, or manually from the Actions tab
# ("Run workflow"). A manual run also creates the matching GitHub release.
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write # create the GitHub release on manual runs
  id-token: write # npm trusted publishing + provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Read version
        id: pkg
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Fail if this version is already on npm
        run: |
          if npm view "$(node -p 'require("./package.json").name')@${{ steps.pkg.outputs.version }}" version 2>/dev/null | grep -q .; then
            echo "::error::Version ${{ steps.pkg.outputs.version }} is already published - bump package.json first"
            exit 1
          fi
      # Authenticates via npm trusted publishing (OIDC) - no token secret.
      # Configure it on npmjs.com: package Settings -> Trusted publishing ->
      # GitHub Actions, workflow file `publish.yml`.
      - run: npm publish --provenance --access public
      - name: Create GitHub release
        if: github.event_name == 'workflow_dispatch'
        run: gh release create "v${{ steps.pkg.outputs.version }}" --target "$GITHUB_SHA" --title "v${{ steps.pkg.outputs.version }}" --notes "See [CHANGELOG.md](CHANGELOG.md)."
        env:
          GH_TOKEN: ${{ github.token }}
